<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 强制不缓存 -->
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给你的小卡片</title>
  <link rel="stylesheet" href="style.css?v=14">

  <!-- ⭐ 背景音乐 ⭐ -->
  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp4" type="audio/mp4">
  </audio>
</head>
<body>

  <!-- 开始页面：直接显示，不用等待 -->
  <div id="start-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);cursor:pointer;-webkit-tap-highlight-color:transparent;">
    <div style="font-size:4rem;margin-bottom:1rem;">♥</div>
    <div style="font-size:1.6rem;font-weight:300;letter-spacing:4px;">给 璇璇</div>
    <div style="font-size:0.85rem;margin-top:0.6rem;">～ 点一下开始 ～</div>
  </div>

  <!-- 卡片叠加层 -->
  <div id="card-container"></div>

  <!-- 底部提示 -->
  <div id="hint">❤</div>

  <script src="cards.js?t=2"></script>
  <script>
    (function(){
      var bgm = document.getElementById('bgm');
      var startScreen = document.getElementById('start-screen');
      var started = false;
      function launch() {
        if (started) return;
        started = true;
        bgm.play().catch(function(){});
        if (typeof window.startCards === 'function') window.startCards();
        startScreen.style.transition = 'opacity 0.5s ease';
        startScreen.style.opacity = '0';
        setTimeout(function(){ startScreen.style.display = 'none'; }, 550);
      }
      // 微信 JS Bridge：已就绪直接启动，否则等待事件
      if (typeof WeixinJSBridge !== 'undefined') {
        setTimeout(launch, 100);
      } else {
        document.addEventListener('WeixinJSBridgeReady', launch, false);
      }
      startScreen.addEventListener('click', launch);
      document.addEventListener('keydown', function(e){ if (e.key === 'Enter') launch(); });
    })();
  </script>
</body>
</html>
