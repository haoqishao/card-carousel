<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给你的小卡片</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp4" type="audio/mp4">
  </audio>

  <!-- 开始页面 -->
  <div id="start-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);cursor:pointer;-webkit-tap-highlight-color:transparent;">
    <div style="font-size:4rem;margin-bottom:1rem;">♥</div>
    <div style="font-size:1.6rem;font-weight:300;letter-spacing:4px;">给 璇璇</div>
    <div style="font-size:0.85rem;margin-top:0.6rem;">～ 点一下开始 ～</div>
  </div>

  <div id="card-container"></div>
  <div id="hint">❤</div>

  <script src="cards.js?t=3"></script>
  <script>
    var bgm = document.getElementById('bgm');
    var ss = document.getElementById('start-screen');
    var started = false;
    ss.addEventListener('click', function(){
      if (started) return;
      started = true;
      bgm.play().catch(function(){});
      if (typeof window.startCards === 'function') window.startCards();
      ss.style.transition = 'opacity 0.5s ease';
      ss.style.opacity = '0';
      setTimeout(function(){ ss.style.display = 'none'; }, 550);
    });
  </script>
</body>
</html>
